# Local stack: docker compose up --build
# Bot (needs TELEGRAM_BOT_TOKEN in .env):  docker compose --profile bot up --build
x-app-env: &app-env
  env_file: .env
  environment:
    NEO4J_URI: bolt://neo4j:7687
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: sqlite+aiosqlite:////app/data/graphtutor.db

services:
  neo4j:
    image: neo4j:5-community
    container_name: graphtutor-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: graphtutor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *app-env
    build: .
    image: graphtutor-api
    container_name: graphtutor-api
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: graphtutor-web
    container_name: graphtutor-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  telegram-bot:
    <<: *app-env
    image: graphtutor-api
    container_name: graphtutor-telegram
    profiles: ["bot"]
    command: ["python", "-m", "graphtutor.channels.telegram"]
    volumes:
      - app_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  app_data:
