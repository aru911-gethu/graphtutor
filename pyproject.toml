[project]
name = "thinknx"
version = "0.1.0"
description = "Personal Adaptive Learning Agent via Telegram, Neo4j, and Spaced Repetition"
authors = [{ name = "aru911-gethu", email = "aru91190@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    # API, Templates & Bot
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "python-telegram-bot>=21.0",
    "jinja2>=3.1.0",

    # Graph & Spaced Repetition
    "neo4j>=5.25.0",
    "fsrs>=4.0.0",

    # Relational DB
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",

    # Task Queue & Cache
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # LLM & Transcribe
    "anthropic>=0.40.0",
    "openai>=1.0.0",

    # Knowledge Graph & Visualization
    "networkx>=3.4",
    "pyvis>=0.3.2",
    "scikit-learn>=1.5",

    # Embeddings
    "sentence-transformers>=3.3.0",
    "numpy>=2.0",

    # Multi-Agent Research
    "crewai>=0.86.0",
    "crewai-tools>=0.14.0",

    # Configuration, Web, Utilities
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.scripts]
thinknx = "thinknx.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --no-header"

[tool.ruff]
line-length = 100
target-version = "py312"
