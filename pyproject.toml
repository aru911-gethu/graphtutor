[project]
name = "thinknx"
version = "0.1.0"
description = "Personal Adaptive Learning Agent via Telegram, Neo4j, and Spaced Repetition"
authors = [{ name = "aru911-gethu", email = "aru91190@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    # API, Templates & Bot
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "python-telegram-bot>=21.0",
    "jinja2>=3.1.0",

    # Graph & Spaced Repetition
    "neo4j>=5.25.0",
    "fsrs>=4.0.0",

    # Relational DB
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",

    # Cache
    "redis>=5.2.0",

    # LLM
    "anthropic>=0.40.0",

    # Knowledge Graph
    "networkx>=3.4",

    # Configuration, Web, Utilities
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.scripts]
thinknx = "thinknx.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --no-header"

[tool.ruff]
line-length = 100
target-version = "py312"
